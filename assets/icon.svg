<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>mutix</title>
  <rect width="256" height="256" rx="56" fill="#ffd166"/>
  <!-- Two AirPods shaped like a closing quotation mark -->
  <g fill="#1d2433">
    <g transform="translate(94 92) rotate(28)">
      <rect x="-12" y="6" width="24" height="64" rx="12"/>
      <ellipse rx="34" ry="31"/>
    </g>
    <g transform="translate(166 92) rotate(28)">
      <rect x="-12" y="6" width="24" height="64" rx="12"/>
      <ellipse rx="34" ry="31"/>
    </g>
  </g>
  <!-- Speaker grilles -->
  <g fill="#ffd166">
    <ellipse cx="103" cy="85" rx="10" ry="6.5" transform="rotate(28 103 85)"/>
    <ellipse cx="175" cy="85" rx="10" ry="6.5" transform="rotate(28 175 85)"/>
  </g>
  <!-- The unspoken words -->
  <g fill="#1d2433">
    <circle cx="98" cy="200" r="10"/>
    <circle cx="128" cy="200" r="10"/>
    <circle cx="158" cy="200" r="10"/>
  </g>
</svg>
