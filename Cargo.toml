[package]
name = "mutix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Silent words to text on Linux, read from the motion sensors of your AirPods"
license = "MIT"
repository = "https://github.com/Gheop/mutix"
readme = "README.md"
keywords = ["airpods", "silent-speech", "linux", "bluetooth", "accessibility"]
categories = ["command-line-utilities", "accessibility"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
evdev = "0.13.2"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
xkbcommon = "0.9.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"], optional = true }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"], optional = true }

[features]
default = []
# The mutix-gtk training app; needs the GTK 4 and libadwaita development files.
gui = ["dep:gtk", "dep:adw"]

[[bin]]
name = "mutix-gtk"
path = "src/bin/mutix-gtk.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
